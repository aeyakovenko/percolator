[package]
name = "percolator"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "percolator"
path = "src/percolator.rs"

[dependencies]
# No runtime dependencies - pure no_std compatible library

[dev-dependencies]
proptest = "1.4"
# Shared spec harnesses used by `cfg(kani)` proofs; pinned for reproducibility.
kani-solana = { git = "https://github.com/kamiyo-ai/kani-solana.git", rev = "e4e02cb57d6f930b355d3d224e1d3d27ed8403d4", default-features = false }

[features]
default = []
test = []  # Use MAX_ACCOUNTS=64 for tests
fuzz = []  # Enable fuzzing tests

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
overflow-checks = true

[profile.sbf]
inherits = "release"
panic = "abort"

[workspace.metadata.kani]
flags = { tests = true }
unstable = { stubbing = true }

[[workspace.metadata.kani.proof]]
harness = ".*"
unwind = 70

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
