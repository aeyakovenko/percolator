[package]
name = "percolator-sdk"
version = "0.1.0"
edition = "2021"
description = "High-performance, type-safe Rust SDK for the Percolator risk engine on Solana"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/aeyakovenko/percolator"
homepage = "https://github.com/aeyakovenko/percolator"
documentation = "https://docs.rs/percolator-sdk"
keywords = ["solana", "defi", "sdk", "perpendiculars"]
categories = ["cryptography::cryptocurrencies", "development-tools::ffi"]

[dependencies]
solana-sdk = "1.18"
solana-client = "1.18"
borsh = "0.10.3"
thiserror = "1.0"
bytemuck = { version = "1.16", features = ["derive"] }
percolator = { path = "../percolator" }

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }
